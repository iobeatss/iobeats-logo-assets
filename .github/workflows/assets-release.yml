name: 🚀 Logo Assets Auto Release

on:
  push:
    branches: [ main ]
    paths:
      - "**.png"
      - "**.svg"
      - "**.gif"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Suffix du tag (optionnel, ex: -rc.1)"
        required: false
        default: ""
      note:
        description: "Notes additionnelles pour la release (optionnel)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⬇️ OPTIMISATION légère (PNG/SVG). Les GIF ne sont pas modifiés.
      - name: 🗜️ Optimize PNG and SVG files
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          ignorePaths: ".github/*"

      # ⬇️ Vérifie les tailles mais IGNORE hero1.gif
      - name: 🔍 Verify image formats & sizes (ignore hero1.gif)
        run: |
          echo "Checking allowed formats and sizes (2MB max, hero1.gif excluded)..."
          # Liste des images à vérifier (on exclut .git, .github et hero1.gif)
          find . -type f \( -name "*.png" -o -name "*.svg" -o -name "*.gif" \) \
            -not -path "./.git/*" -not -path "./.github/*" -not -name "hero1.gif" > image_list.txt

          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            if [ "$size" -gt 2000000 ]; then
              echo "❌ $file exceeds 2MB (size: $size bytes)"
              exit 1
            fi
          done < image_list.txt

          echo "✅ All checked files are under 2MB. (hero1.gif was excluded from the check)"

      - name: 🧾 Compute tag
        id: tag
        run: |
          DATE=$(date +'%Y.%m.%d')
          SUFFIX="${{ github.event.inputs.tag_suffix }}"
          echo "tag=v${DATE}${SUFFIX}" >> $GITHUB_OUTPUT

      - name: 📦 Create ZIP package (includes hero1.gif)
        run: |
          mkdir -p dist
          zip -r dist/iob-logo-assets.zip . -x ".git/*" ".github/*"
          sha256sum dist/iob-logo-assets.zip | tee dist/iob-logo-assets.sha256

      - name: 🧠 Generate changelog
        id: changelog
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST=$(git describe --tags --abbrev=0)
            echo "## Changes since $LAST" > CHANGELOG_TMP.md
            git log --pretty=format:"- %s (%h)" $LAST..HEAD >> CHANGELOG_TMP.md
          else
            echo "Initial release of iO Beats Logo Pack" > CHANGELOG_TMP.md
          fi

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "IOB Logo Assets ${{ steps.tag.outputs.tag }}"
          body: |
            🧡 **IO Beats Logo Pack**
            Optimized (PNG/SVG) and validated assets.
            Note: `hero1.gif` is intentionally excluded from size checks.

            ${{ github.event.inputs.note }}

            <details>
            <summary>Changelog</summary>

            $(cat CHANGELOG_TMP.md)

            </details>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📎 Upload ZIP & checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/iob-logo-assets.zip
            dist/iob-logo-assets.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
